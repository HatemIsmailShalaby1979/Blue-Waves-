[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-waves"
version = "0.3.0"
description = "Multi-format content studio with autonomous generation and two-gate governance"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "numpy>=1.26",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "requests>=2.31",
    "edge-tts>=6.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34"]

test = ["pytest>=8"]

[project.scripts]
blue-waves = "blue_waves.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["blue_waves*", "vendor*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
